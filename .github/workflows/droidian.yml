name: droidian-boot-vince
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi bc bison flex libssl-dev libelf-dev python3 git debootstrap qemu-user-static binfmt-support
      - name: Kernel
        run: |
          ARGS="O=out ARCH=arm64 CC=clang LD=ld.lld CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-"
          make $ARGS vince-perf_defconfig
          cat halium.fragment >> out/.config
          make $ARGS olddefconfig
          grep -E "CONFIG_(SYSVIPC|UTS_NS|PID_NS|USER_NS|IPC_NS|DEVTMPFS|OVERLAY_FS|SQUASHFS|VETH|AUTOFS4_FS)=" out/.config
          make $ARGS -j$(nproc)
          ls -l out/arch/arm64/boot/Image.gz-dtb
      - name: Initrd Droidian
        run: |
          set -eux
          sudo debootstrap --arch=arm64 --variant=minbase bookworm rfs http://deb.debian.org/debian
          sudo chroot rfs apt-get update
          sudo chroot rfs apt-get install -y --no-install-recommends initramfs-tools git ca-certificates build-essential debhelper devscripts fakeroot
          sudo chroot rfs git clone --depth 1 https://github.com/droidian/initramfs-tools-halium /src
          sudo chroot rfs bash -c 'cd /src && apt-get build-dep -y . || true; dpkg-buildpackage -us -uc -b'
          sudo chroot rfs bash -c 'apt-get install -y /initramfs-tools-halium*.deb || dpkg -i /initramfs-tools-halium*.deb'
          sudo mkdir -p rfs/lib/modules/4.9.296-halium
          echo "COMPRESS=gzip" | sudo tee -a rfs/etc/initramfs-tools/initramfs.conf
          sudo chroot rfs mkinitramfs -o /initrd.img 4.9.296-halium
          sudo cp rfs/initrd.img ./initrd.img
          ls -l initrd.img
      - name: Rakit boot.img
        run: |
          set -eux
          git clone --depth 1 https://github.com/aosp-mirror/platform_system_tools_mkbootimg mk
          CMD="androidboot.hardware=qcom msm_rtb.filter=0x237 ehci-hcd.park=3 lpm_levels.sleep_disabled=1 androidboot.bootdevice=7824900.sdhci androidboot.selinux=permissive droidian.lvm.prefer"
          python3 mk/mkbootimg.py --header_version 0 \
            --kernel out/arch/arm64/boot/Image.gz-dtb --ramdisk initrd.img \
            --pagesize 2048 --base 0x0 \
            --kernel_offset 0x80008000 --ramdisk_offset 0x81000000 \
            --second_offset 0x0 --tags_offset 0x80000100 \
            --os_version 13.0.0 --os_patch_level 2025-12 \
            --cmdline "$CMD" -o boot-vince-droidian.img
          ls -l boot-vince-droidian.img
          [ $(stat -c %s boot-vince-droidian.img) -le 33554432 ]
      - uses: actions/upload-artifact@v4
        with:
          name: boot
          path: |
            boot-vince-droidian.img
            out/.config
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "droidian-${{ github.run_number }}" boot-vince-droidian.img --title "droidian-${{ github.run_number }}" --notes "kernel 4.9 + initrd droidian"
