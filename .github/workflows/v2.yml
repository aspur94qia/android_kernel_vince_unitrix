name: v2
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi bc bison flex libssl-dev libelf-dev python3 git debootstrap qemu-user-static binfmt-support
      - name: Kernel
        run: |
          cat > aclang <<'W'
          #!/bin/sh
          exec clang --target=aarch64-linux-gnu -fintegrated-as -Wno-error -Qunused-arguments "$@"
          W
          sed -i 's/^ *//' aclang
          sudo install -m 755 aclang /usr/local/bin/aclang
          cat > halium.fragment <<'FRAG'
          CONFIG_SYSVIPC=y
          CONFIG_POSIX_MQUEUE=y
          CONFIG_FHANDLE=y
          CONFIG_UTS_NS=y
          CONFIG_PID_NS=y
          CONFIG_USER_NS=y
          CONFIG_IPC_NS=y
          CONFIG_DEVTMPFS=y
          CONFIG_DEVTMPFS_MOUNT=y
          CONFIG_OVERLAY_FS=y
          CONFIG_SQUASHFS=y
          CONFIG_SQUASHFS_XZ=y
          CONFIG_SQUASHFS_ZLIB=y
          CONFIG_VETH=y
          CONFIG_MACVLAN=y
          CONFIG_AUTOFS4_FS=y
          CONFIG_CGROUP_DEVICE=y
          CONFIG_MEMCG=y
          CONFIG_NETFILTER_XT_MATCH_OWNER=y
          CONFIG_EXT4_FS_POSIX_ACL=y
          FRAG
          sed -i 's/^ *//' halium.fragment
          A="O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-"
          grep -rn "no-integrated-as" Makefile arch/arm64/Makefile || true
          sed -i "s/-no-integrated-as//g; s/-fno-integrated-as//g" Makefile arch/arm64/Makefile
          make $A vince-perf_defconfig
          cat halium.fragment >> out/.config
          make $A olddefconfig
          grep -E "STACKPROTECTOR" out/.config
          grep -E "CONFIG_(SYSVIPC|USER_NS|PID_NS|DEVTMPFS|OVERLAY_FS|SQUASHFS|VETH)=" out/.config
          sed -i "s/^\(\$(obj)\/gettimeofday.o\)/\1/" arch/arm64/kernel/vdso/Makefile
          sed -i "1i CC_VDSO := aarch64-linux-gnu-gcc" arch/arm64/kernel/vdso/Makefile
          make $A -j$(nproc) CC_VDSO=aarch64-linux-gnu-gcc
          ls -l out/arch/arm64/boot
      - name: Release kernel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp out/arch/arm64/boot/Image.gz-dtb kernel-Image.gz-dtb
          gh release create "kernel-${{ github.run_number }}" kernel-Image.gz-dtb out/.config --title "kernel-${{ github.run_number }}" --notes "kernel 4.9 halium config"
