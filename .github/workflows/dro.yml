name: dro-vince-full-github
on:
  push:
    branches: [stable]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev mkbootimg gcc-aarch64-linux-gnu wget zip
      - name: Build kernel vince
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make vince_defconfig
          make -j$(nproc) Image.gz-dtb dtbo.img || make -j$(nproc) Image.gz-dtb
      - name: Build boot 28MB REAL
        run: |
          wget -q https://github.[STRIPPED 80 bytes].img -O ramdisk.img
          mkbootimg --kernel arch/arm64/boot/Image.gz-dtb --ramdisk ramdisk.img --cmdline "androidboot.selinux=permissive" --base 0x80000000 --pagesize 2048 --kernel_offset 0x00008000 --ramdisk_offset 0x01000000 --tags_offset 0x00000100 -o boot-vince-28MB-REAL.img
          ls -lh *.img
      - uses: actions/upload-artifact@v4
        with:
          name: BOOT-VINCE-28MB-REAL
          path: boot-vince-28MB-REAL.img
